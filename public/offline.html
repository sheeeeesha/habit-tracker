<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — StreakWrapped</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #08070a;
        color: #f6f2e9;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .blob {
        position: fixed;
        inset: auto;
        width: 60vmax; height: 60vmax;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        pointer-events: none;
      }
      .b1 { background: #ff2e88; top: -20vmax; left: -20vmax; }
      .b2 { background: #9b5cff; bottom: -25vmax; right: -20vmax; }
      main { position: relative; max-width: 30rem; }
      h1 {
        font-size: clamp(2.5rem, 12vw, 4rem);
        line-height: 0.92;
        margin: 0 0 1rem;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      p { color: rgba(246, 242, 233, 0.66); line-height: 1.6; margin: 0 0 2rem; }
      button {
        font: inherit;
        font-weight: 700;
        border: 0;
        cursor: pointer;
        padding: 0.9rem 1.6rem;
        border-radius: 999px;
        background: #c7f94e;
        color: #121a00;
      }
    </style>
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <main>
      <h1>You&rsquo;re offline</h1>
      <p>
        Your streaks are safe on this device. Reconnect and everything picks up
        exactly where you left off.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
